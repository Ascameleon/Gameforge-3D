name: Deploy Gameforge 3D
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'README.md'
      - 'scripts/prepare_pages_site.sh'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gameforge-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/configure-pages@v6
      - name: Prepare offline site
        run: bash scripts/prepare_pages_site.sh site
      - name: Verify local Three.js runtime
        run: |
          test -s site/vendor/three/build/three.module.js
          test -s site/vendor/three/examples/jsm/controls/OrbitControls.js
          test -s site/vendor/three/examples/jsm/exporters/GLTFExporter.js
          test -s site/vendor/three/examples/jsm/utils/TextureUtils.js
          test -s site/vendor/three/LICENSE
          node --input-type=module -e "import * as THREE from './site/vendor/three/build/three.module.js'; if (THREE.REVISION !== '160') throw new Error('Unexpected Three.js revision ' + THREE.REVISION); console.log('Three.js revision', THREE.REVISION)"
      - uses: actions/upload-artifact@v7
        with:
          name: gameforge3d-offline-site
          path: site/
          retention-days: 14
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
